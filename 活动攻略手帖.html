<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>活动攻略手帖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 版面构想：把页面当成一本贴满和纸的手帖。底纸是薄荷青绿的水彩，樱花、梅花和放射状小烟花散落其上；
   面板是奶油色的和纸卡片，内侧缝线，角上探出花朵；封面顶部是点点蕾丝缎带。清单的勾选会开出一朵樱花。 */
:root{
  --bg-top:#a9d6cd; --bg-mid:#d9ebdf; --bg-bot:#f7e3e2;
  --w1:rgba(255,255,255,.5); --w2:rgba(247,190,205,.36); --w3:rgba(183,216,236,.5);
  --noise:.26; --panel-noise:.22; --fl-mult:1;
  --card:#fffaf0; --card-a:rgba(255,250,240,.94);
  --ink:#3d5958; --ink-2:#67827f;
  --teal:#7cc0b5; --teal-d:#3f8f85; --mint:#c4e4d8; --pink:#f4b9c5; --rose:#e57d94; --cam:#d6425f; --on-cam:#fff;
  --stitch:rgba(74,154,144,.5); --stitch-soft:rgba(74,154,144,.26);
  --shadow:rgba(60,110,104,.34);
  --petal:#fad2db; --petal-edge:#eea3b6; --ume:#f4a8ba; --ume-edge:#e98aa2; --ume-in:#fde5ea;
  --center:#e0698a; --center-line:rgba(224,105,138,.55); --stamen:#f1c34f; --burst:#ee9fb4;
  --t1:#d6ede1; --t2:#fcdde3; --t3:#d5e8f4; --t4:#f9efbb;
  --cv1:#8fcfc4; --cv2:#b9e1d5; --cv3:#e7f2e3; --st1:#7ec5ba; --st2:#9bd4ca;
  --wash-a:rgba(255,255,255,.55); --wash-b:rgba(247,190,205,.5);
  --dot:rgba(255,255,255,.75); --dotted:rgba(255,255,255,.95);
  --input:rgba(255,255,255,.7);
  --font-d:"Klee One","Zen Maru Gothic","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-b:"Zen Maru Gothic","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-top:#1b302f; --bg-mid:#1f2c2c; --bg-bot:#2b2830;
    --w1:rgba(120,170,160,.12); --w2:rgba(200,120,140,.14); --w3:rgba(110,150,190,.14);
    --noise:.4; --panel-noise:.35; --fl-mult:.55;
    --card:#223130; --card-a:rgba(34,49,48,.95);
    --ink:#e3eee8; --ink-2:#a6beb8;
    --teal:#5da398; --teal-d:#86cdc1; --mint:#2f5650; --pink:#a96b7b; --rose:#ea8fa5; --cam:#f27a93; --on-cam:#2b1620;
    --stitch:rgba(134,205,193,.42); --stitch-soft:rgba(134,205,193,.2);
    --shadow:rgba(0,0,0,.55);
    --petal:#b5788a; --petal-edge:#dc93a9; --ume:#bf788d; --ume-edge:#e397ad; --ume-in:#e6b2c0;
    --center:#f08aa4; --center-line:rgba(240,138,164,.5); --stamen:#e6c46a; --burst:#d98aa0;
    --t1:#2d4a44; --t2:#4a3440; --t3:#2c4254; --t4:#4c4630;
    --cv1:#2e5650; --cv2:#2a4642; --cv3:#263836; --st1:#3d6d66; --st2:#35605a;
    --wash-a:rgba(120,170,160,.25); --wash-b:rgba(200,120,140,.3);
    --dot:rgba(255,255,255,.28); --dotted:rgba(255,255,255,.3);
    --input:rgba(255,255,255,.07);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-top:#1b302f; --bg-mid:#1f2c2c; --bg-bot:#2b2830;
  --w1:rgba(120,170,160,.12); --w2:rgba(200,120,140,.14); --w3:rgba(110,150,190,.14);
  --noise:.4; --panel-noise:.35; --fl-mult:.55;
  --card:#223130; --card-a:rgba(34,49,48,.95);
  --ink:#e3eee8; --ink-2:#a6beb8;
  --teal:#5da398; --teal-d:#86cdc1; --mint:#2f5650; --pink:#a96b7b; --rose:#ea8fa5; --cam:#f27a93; --on-cam:#2b1620;
  --stitch:rgba(134,205,193,.42); --stitch-soft:rgba(134,205,193,.2);
  --shadow:rgba(0,0,0,.55);
  --petal:#b5788a; --petal-edge:#dc93a9; --ume:#bf788d; --ume-edge:#e397ad; --ume-in:#e6b2c0;
  --center:#f08aa4; --center-line:rgba(240,138,164,.5); --stamen:#e6c46a; --burst:#d98aa0;
  --t1:#2d4a44; --t2:#4a3440; --t3:#2c4254; --t4:#4c4630;
  --cv1:#2e5650; --cv2:#2a4642; --cv3:#263836; --st1:#3d6d66; --st2:#35605a;
  --wash-a:rgba(120,170,160,.25); --wash-b:rgba(200,120,140,.3);
  --dot:rgba(255,255,255,.28); --dotted:rgba(255,255,255,.3);
  --input:rgba(255,255,255,.07);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg-mid);
  color:var(--ink);
  font-family:var(--font-b);
  font-size:15px;
  line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:clamp(22px,5vw,56px) 88px;
  font-variant-numeric:tabular-nums;
}

/* 底纸：水彩色块、纸纹、散落的花 */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(60vmax 42vmax at 10% 6%,var(--w1),transparent 70%),
    radial-gradient(50vmax 40vmax at 92% 20%,var(--w2),transparent 70%),
    radial-gradient(62vmax 50vmax at 68% 98%,var(--w3),transparent 70%),
    linear-gradient(180deg,var(--bg-top),var(--bg-mid) 52%,var(--bg-bot))}
.bg::after{content:"";position:absolute;inset:0;opacity:var(--noise);mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 .36 0 0 0 0 .44 0 0 0 0 .4 0 0 0 .55 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
.fl,.deco{position:absolute;height:auto;opacity:calc(var(--o,.5) * var(--fl-mult,1))}
.deco{pointer-events:none;z-index:0}

.wrap{max-width:1040px;margin:0 auto;display:grid;gap:30px}

/* 封面：和纸缎带＋标签贴纸 */
.cover{position:relative;border-radius:24px;overflow:hidden;
  background:
    radial-gradient(var(--dot) 2px,transparent 2.6px) 0 0/18px 18px,
    linear-gradient(155deg,var(--cv1),var(--cv2) 55%,var(--cv3));
  box-shadow:0 24px 44px -26px var(--shadow)}
.ribbon{height:40px;
  background:
    radial-gradient(var(--dot) 2px,transparent 2.6px) 0 0/14px 14px,
    repeating-linear-gradient(0deg,var(--st1) 0 13px,var(--st2) 13px 26px)}
.lace{height:14px;margin-top:-1px;background:radial-gradient(circle at 8px 0,var(--card) 8.5px,transparent 9px) 0 0/16px 14px repeat-x}
.cover-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:10px;padding:18px clamp(16px,3vw,30px) 32px;align-items:center}
.label{position:relative;background:var(--card-a);border-radius:18px;padding:clamp(22px,3.6vw,34px) clamp(20px,3.4vw,34px);box-shadow:0 14px 26px -18px var(--shadow)}
.label::before{content:"";position:absolute;inset:8px;border:1.5px dashed var(--stitch);border-radius:12px;pointer-events:none}
.label>*{position:relative}
.kicker{margin:0 0 6px;font-family:var(--font-d);font-size:13px;letter-spacing:.2em;color:var(--rose)}
h1{font-family:var(--font-d);font-weight:600;font-size:clamp(32px,6.4vw,54px);line-height:1.2;letter-spacing:.08em;margin:0;color:var(--teal-d);text-wrap:balance}
.wavy{display:block;width:100%;max-width:230px;height:10px;margin:8px 0 14px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='10'><path d='M0 5 Q10 0 20 5 T40 5' fill='none' stroke='%23ee9fb4' stroke-width='1.8' stroke-linecap='round'/></svg>") 0 0/40px 10px repeat-x}
.lede{margin:0;color:var(--ink-2);max-width:32em}
.lede b{color:var(--ink);font-weight:700}
.count{margin:10px 0 0;font-size:13px;color:var(--cam);letter-spacing:.06em}
.seal{position:absolute;right:-8px;top:-12px;width:54px;height:54px;border-radius:50%;background:var(--cam);color:var(--on-cam);display:grid;place-items:center;font-family:var(--font-d);font-weight:600;font-size:14px;letter-spacing:.08em;writing-mode:vertical-rl;padding-top:2px;transform:rotate(10deg);box-shadow:0 6px 12px -6px var(--shadow);border:2px solid rgba(255,255,255,.7)}
.cover-art{display:block;width:100%;max-width:440px;height:auto;justify-self:center}

/* 面板：奶油和纸 */
.panel{position:relative;border-radius:20px;overflow:hidden;background:var(--card-a);
  padding:clamp(24px,4vw,36px) clamp(20px,4vw,40px) clamp(26px,4vw,38px);
  box-shadow:0 16px 34px -22px var(--shadow)}
.panel::before{content:"";position:absolute;inset:9px;border:1.5px dashed var(--stitch);border-radius:14px;pointer-events:none}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--panel-noise);mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 .5 0 0 0 0 .52 0 0 0 0 .44 0 0 0 .5 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
.panel>*:not(.deco){position:relative;z-index:1}

h2{font-family:var(--font-d);font-weight:600;font-size:23px;letter-spacing:.12em;margin:0 0 22px;color:var(--teal-d);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:10px;margin-left:6px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='10'><path d='M0 5 Q10 0 20 5 T40 5' fill='none' stroke='%237cc0b5' stroke-opacity='.7' stroke-width='1.5' stroke-linecap='round'/></svg>") 0 0/40px 10px repeat-x}
.h-ic{width:30px;height:30px;flex:none}

/* 概览 */
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 18px}
.seg button{font:inherit;font-size:13.5px;letter-spacing:.06em;color:var(--teal-d);background:var(--input);border:1.5px solid var(--teal);border-radius:999px;padding:6px 18px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cam);border-color:var(--cam);color:var(--on-cam)}
.seg button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:0}
.fig{border-radius:18px;padding:16px 18px;min-width:0;border:2px dotted var(--dotted);background:var(--t1)}
.fig:nth-child(2){background:var(--t2)}
.fig:nth-child(3){background:var(--t3)}
.fig:nth-child(4){background:var(--t4)}
.fig dt{font-size:12.5px;letter-spacing:.14em;color:var(--ink-2);margin:0 0 2px}
.fig dd{margin:0}
.fig .v{font-family:var(--font-d);font-weight:600;font-size:clamp(25px,4vw,32px);line-height:1.25;display:block}
.fig .n{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.notes{margin:24px 0 0;display:grid;gap:8px;font-size:14px}
.notes p{margin:0;padding-left:26px;position:relative}
.notes p::before{content:"";position:absolute;left:0;top:.5em;width:16px;height:16px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><g fill='%23f6b9c6' stroke='%23e98aa2' stroke-width='.7'><circle cx='10' cy='5' r='3.6'/><circle cx='15' cy='9' r='3.6'/><circle cx='13' cy='15' r='3.6'/><circle cx='7' cy='15' r='3.6'/><circle cx='5' cy='9' r='3.6'/></g><circle cx='10' cy='10' r='2.4' fill='%23f1c34f'/></svg>") center/contain no-repeat}
.notes b{font-weight:700;color:var(--cam)}

/* 参数 */
details.params>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:600;font-size:23px;letter-spacing:.12em;color:var(--teal-d)}
details.params>summary::-webkit-details-marker{display:none}
details.params>summary::after{content:"展开修改";margin-left:auto;font-family:var(--font-b);font-weight:500;font-size:12.5px;letter-spacing:.08em;color:var(--teal-d);background:var(--t1);border-radius:999px;padding:3px 14px}
details.params[open]>summary::after{content:"收起"}
details.params>summary:focus-visible{outline:2px solid var(--rose);outline-offset:6px;border-radius:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px 24px;margin-top:24px}
.pf{display:grid;gap:4px;min-width:0}
.pf label{font-size:12.5px;letter-spacing:.08em;color:var(--ink-2)}
.pf .row{display:flex;align-items:baseline;gap:8px;background:var(--input);border:1.5px solid var(--mint);border-radius:14px;padding:3px 14px}
.pf .row:focus-within{border-color:var(--rose);box-shadow:0 0 0 3px rgba(229,125,148,.2)}
.pf input,.pf select{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:6px 0;outline:none;font-variant-numeric:tabular-nums}
.pf select option{color:#33403b;background:#fff}
.pf .u{font-size:12px;color:var(--ink-2);white-space:nowrap}
.pf .h{font-size:11.5px;color:var(--ink-2);opacity:.9;padding-left:6px}
.pbtn-row{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
button.ghost{font:inherit;font-size:13px;color:var(--teal-d);background:var(--input);border:1.5px solid var(--teal);border-radius:999px;padding:6px 18px;cursor:pointer;letter-spacing:.06em}
button.ghost:hover{background:var(--t1)}
button.ghost:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

/* 清单 */
.overall{display:grid;gap:10px;margin-bottom:22px}
.overall .line{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 18px;font-size:14px}
.overall .line b{font-family:var(--font-d);font-size:19px;color:var(--cam)}
.bar{height:10px;border-radius:999px;background:var(--t1);overflow:hidden;border:1.5px solid var(--mint)}
.bar>i{display:block;height:100%;width:0;border-radius:999px;transition:width .4s ease;
  background:radial-gradient(rgba(255,255,255,.7) 1.4px,transparent 1.8px) 0 0/8px 8px,linear-gradient(90deg,var(--pink),var(--rose))}
#days{display:grid;gap:10px}
.day{border-radius:18px;background:rgba(255,255,255,.5);border:1.5px solid var(--stitch-soft)}
:root[data-theme="dark"] .day{background:rgba(255,255,255,.04)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .day{background:rgba(255,255,255,.04)}}
.day.is-today{background:var(--t2);border-color:var(--rose);border-width:2px}
.day.done{border-style:dashed}
.day-head{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto 16px;align-items:center;gap:6px 14px;padding:14px 18px}
.day-head:focus-visible{outline:2px solid var(--rose);outline-offset:-2px;border-radius:16px}
.d-date{font-family:var(--font-d);font-weight:600;font-size:20px;letter-spacing:.04em}
.d-date small{font-family:var(--font-b);font-weight:400;font-size:12px;color:var(--ink-2);margin-left:6px;letter-spacing:.06em}
.badge{font-size:11px;letter-spacing:.12em;color:var(--on-cam);background:var(--cam);border-radius:999px;padding:0 10px;line-height:21px}
.d-sum{font-size:12.5px;color:var(--ink-2);text-align:right;min-width:0}
.d-prog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.ring{width:24px;height:24px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2.6}
.ring .bg-c{stroke:var(--mint)}
.ring .fg-c{stroke:var(--rose);stroke-linecap:round;stroke-dasharray:56.55;stroke-dashoffset:56.55;transition:stroke-dashoffset .35s ease}
.chev{width:12px;height:12px;transition:transform .25s ease;stroke:var(--teal-d);fill:none;stroke-width:1.8}
.day.open .chev{transform:rotate(180deg)}
.day.done .d-prog{color:var(--cam)}
.day-body{padding:0 18px 12px}
.task{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:10px 0;border-top:1.5px dashed var(--stitch-soft);cursor:pointer}
.task:first-child{border-top:0}
.task input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.box{width:32px;height:32px;display:block;overflow:visible}
.box .ring0{fill:rgba(255,255,255,.65);stroke:var(--teal);stroke-width:1.8;transition:stroke .25s,fill .25s}
:root[data-theme="dark"] .box .ring0{fill:rgba(255,255,255,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .box .ring0{fill:rgba(255,255,255,.06)}}
.box .bloom{transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-50deg);opacity:0;transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .2s}
.box .tick{fill:none;stroke:var(--cam);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .35s ease .12s}
.task input:checked+.box .bloom{transform:scale(1.18) rotate(0);opacity:1}
.task input:checked+.box .tick{stroke-dashoffset:0}
.task input:checked+.box .ring0{stroke:var(--rose)}
.task input:focus-visible+.box .ring0{stroke:var(--rose);stroke-width:3}
.t-text{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.t-time{font-size:12px;color:var(--teal-d);letter-spacing:.06em;font-variant-numeric:tabular-nums;background:var(--t1);border-radius:999px;padding:0 9px;line-height:20px}
.t-main{font-size:15px}
.t-meta{font-size:12.5px;color:var(--ink-2);text-align:right}
.task input:checked~.t-text .t-main{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--rose);text-decoration-thickness:1.5px}
.day-note{font-size:12.5px;color:var(--ink-2);margin:0 0 6px}
.reset-row{margin-top:22px;display:flex;justify-content:flex-end}

/* 走势图 */
.chart-box{width:100%;overflow-x:auto}
.chart-box svg{display:block;width:100%;min-width:520px;height:auto}
.ax{fill:var(--ink-2);font-size:11px;font-family:var(--font-b)}
.ax-strong{fill:var(--ink);font-size:12.5px;font-weight:700;font-family:var(--font-d)}
.grid-l{stroke:var(--stitch-soft);stroke-width:1.2;stroke-dasharray:3 5}
.cap-l{stroke:var(--rose);stroke-width:1.6;stroke-dasharray:6 5}
.ln{fill:none;stroke:var(--cam);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.area{fill:url(#areaG)}

/* 明细表 */
.tbl{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:780px;font-size:13.5px}
th{font-weight:500;font-size:12px;letter-spacing:.08em;color:var(--teal-d);text-align:right;padding:8px 10px;background:var(--t1);white-space:nowrap}
th:first-child{text-align:left;border-radius:12px 0 0 12px;padding-left:14px}
th:last-child{border-radius:0 12px 12px 0}
td{text-align:right;padding:9px 10px;border-bottom:1.5px dashed var(--stitch-soft);white-space:nowrap}
td:first-child{text-align:left;padding-left:14px}
tr.tot td{font-weight:700;border-bottom:0;background:var(--t4)}
tr.tot td:first-child{border-radius:12px 0 0 12px}
tr.tot td:last-child{border-radius:0 12px 12px 0}
tr.now td{background:var(--t2)}

.foot ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:13.5px;color:var(--ink-2)}
.foot li{position:relative;padding-left:26px}
.foot li::before{content:"";position:absolute;left:0;top:.45em;width:16px;height:16px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><g fill='%23f6b9c6' stroke='%23e98aa2' stroke-width='.7'><circle cx='10' cy='5' r='3.6'/><circle cx='15' cy='9' r='3.6'/><circle cx='13' cy='15' r='3.6'/><circle cx='7' cy='15' r='3.6'/><circle cx='5' cy='9' r='3.6'/></g><circle cx='10' cy='10' r='2.4' fill='%23f1c34f'/></svg>") center/contain no-repeat}

/* 今日进度 */
.today{position:relative;border-radius:18px;padding:18px 20px;margin-bottom:22px;background:var(--t2);border:2px dotted var(--dotted);display:grid;gap:12px}
.today .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.today .ttl{font-family:var(--font-d);font-weight:600;font-size:20px;letter-spacing:.06em;color:var(--cam)}
.chip{font-size:12px;letter-spacing:.08em;border-radius:999px;padding:0 12px;line-height:22px;background:var(--cam);color:var(--on-cam)}
.chip.mint{background:var(--t1);color:var(--teal-d);border:1.5px solid var(--teal);line-height:19px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px 18px;align-items:end}
.tgrid .k{display:block;font-size:12px;color:var(--ink-2);letter-spacing:.08em}
.tgrid .v{font-family:var(--font-d);font-weight:600;font-size:21px}
.tgrid .v.pos{color:var(--teal-d)}
.tgrid .v.neg{color:var(--cam)}
.curin{display:flex;align-items:center;gap:8px;background:var(--input);border:1.5px solid var(--mint);border-radius:14px;padding:2px 12px}
.curin input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;padding:5px 0;outline:none;font-variant-numeric:tabular-nums}
.curin .u{font-size:12px;color:var(--ink-2)}
.curin:focus-within{border-color:var(--rose);box-shadow:0 0 0 3px rgba(229,125,148,.2)}
.tmsg{margin:0;font-size:14px}
.tmsg b{color:var(--cam);font-weight:700}
.t-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.t-actions .hint{font-size:12px;color:var(--ink-2)}
.tl{grid-column:2 / -1;list-style:none;margin:2px 0 0;padding:0;display:grid;gap:2px;font-size:12.5px;color:var(--ink-2)}
.tl li{display:flex;gap:10px}
.tl .tt{font-variant-numeric:tabular-nums;color:var(--teal-d);min-width:44px}
.tl .buy{color:var(--cam)}
.goal-l{stroke:var(--teal-d);stroke-width:1.4;stroke-dasharray:2 5}
.cmp table{min-width:540px}
@media (max-width:700px){
  .cover-grid{grid-template-columns:minmax(0,1fr)}
  .cover-art{max-width:300px}
  .seal{right:6px;top:-14px}
  .day-head{grid-template-columns:auto auto minmax(0,1fr) auto 14px;gap:4px 10px;padding:13px 14px}
  .d-sum{display:none}
  .day-body{padding:0 14px 12px}
  .task{grid-template-columns:32px minmax(0,1fr)}
  .t-meta{grid-column:2;text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}

  function simulate(p, pts0){
    var mpg = p.mpg > 0 ? p.mpg : 7, rec = p.rec > 0 ? p.rec : 24, hpp = p.hpp > 0 ? p.hpp : 10, cap = p.gcap > 0 ? p.gcap : 5;
    var gate = p.mode === 'g5' ? cap : Math.max(1, cap - 1);
    var wins = windows(p), endAbs = ENDDAYS * 1440 + ENDH * 60, days = [], i;
    for (i = 0; i < DAYS; i++) days.push({g:0, t:0, p:0, nat:0, pts:0, ev:[]});
    if (!wins.length) return {days:days, wins:wins, pts:pts0};
    var h = cap, prog = 0, pts = pts0, phase = 'play', bought = false, busy = 0, tk = {};
    for (var t = wins[0][0]; t < endAbs; t++){
      var di = Math.floor(t / 1440), m = t - di * 1440;
      if (t >= busy){
        var wi = -1, k;
        for (k = 0; k < wins.length; k++){ if (m >= wins[k][0] && m < wins[k][1]){ wi = k; break; } }
        if (wi >= 0 && m + mpg <= wins[wi][1] && t + mpg <= endAbs){
          var D = days[di], tleft = (tk[di] || 0) < p.tk, act = 0;
          if (p.after === '1' && pts >= p.goal){
            if (h >= 1) act = 1; else if (tleft) act = 2;
          } else if (p.mode === 'cont'){
            if (h >= 1) act = 1;
            else if (tleft) act = 2;
            else { h += hpp; D.p++; D.ev.push({t:m, k:'b'}); act = 1; }
          } else {
            if (phase === 'wait' && h >= gate){ phase = 'play'; bought = false; }
            if (phase === 'wait'){ if (tleft) act = 2; }
            else if (h >= 1) act = 1;
            else if (!bought){ h += hpp; D.p++; D.ev.push({t:m, k:'b'}); bought = true; act = 1; }
            else { phase = 'wait'; if (tleft) act = 2; }
          }
          if (act === 1){ h--; pts += p.hp; D.g++; D.pts += p.hp; D.ev.push({t:m, k:'g'}); busy = t + mpg; }
          else if (act === 2){ tk[di] = (tk[di] || 0) + 1; pts += p.tp; D.t++; D.pts += p.tp; D.ev.push({t:m, k:'t'}); busy = t + mpg; }
        }
      }
      if (h < cap){ prog++; if (prog >= rec){ h++; prog = 0; days[di].nat++; } } else prog = 0;
    }
    return {days:days, wins:wins, pts:pts};
  }

  function reward(c, p){ var rs = p.rstep > 0 ? p.rstep : 10000; return Math.floor(Math.max(0, Math.min(c, p.cap) - p.rstart) / rs) * p.rgem; }

  /* 以今天起床时的 pt 为起点排计划，再按实际进度和计划的差额整体顺延 */
  function calc(p, ds){
    var s1 = simulate(p, ds.pt), pn = 0;
    s1.days[0].ev.forEach(function(e){ if (e.t < nowMin){ if (e.k === 'g') pn += p.hp; else if (e.k === 't') pn += p.tp; } });
    var gained = p.cur - ds.pt, dev = gained - pn;
    var s2 = simulate(p, ds.pt + dev), cum = ds.pt + dev, rows = [], remPacks = 0;
    var tot = {games:0, used:0, nat:0, packs:0, gems:0, pts:0};
    s2.days.forEach(function(d, i){
      cum += d.pts;
      rows.push({i:i, games:d.g + d.t, tickets:d.t, hg:d.g, nat:d.nat, packs:d.p, gems:d.p * p.gpp, pts:d.pts, cum:cum, reward:reward(cum, p), ev:d.ev});
      tot.games += d.g + d.t; tot.used += d.g; tot.nat += d.nat; tot.packs += d.p; tot.gems += d.p * p.gpp; tot.pts += d.pts;
      d.ev.forEach(function(e){ if (e.k === 'b' && (i > 0 || e.t >= nowMin)) remPacks++; });
    });
    var rwF = reward(cum, p), rwN = reward(p.cur, p), remGems = remPacks * p.gpp, gain = rwF - rwN;
    var rt = -1, rg = -1;
    rows.forEach(function(r, i){ if (rt < 0 && r.cum >= p.target) rt = i; if (rg < 0 && r.cum >= p.goal) rg = i; });
    var plan = rows[0].pts, frac = plan > 0 ? Math.max(0, (plan - pn) / plan) : 0, remDays = (DAYS - 1) + frac;
    var typ = rows[Math.min(1, rows.length - 1)];
    return {rows:rows, wins:s2.wins, tot:tot, final:cum, rwF:rwF, rwN:rwN, remGems:remGems, remPacks:remPacks, gain:gain, net:gain - remGems,
      roi: remGems > 0 ? gain / remGems : 0, reachT:rt, reachG:rg, typ:typ,
      today:{plan:plan, pn:pn, gained:gained, dev:dev}, quota: remDays > 0 ? Math.max(0, p.goal - p.cur) / remDays : 0};
  }

  function ensureDs(){
    var key = dkey(0);
    if (!S.ds){
      var s = simulate(S.p, 0), pn = 0;
      s.days[0].ev.forEach(function(e){ if (e.t < nowMin){ if (e.k === 'g') pn += S.p.hp; else if (e.k === 't') pn += S.p.tp; } });
      S.ds = {key:key, pt:S.p.cur - pn};
    } else if (S.ds.key !== key){
      S.ds = {key:key, pt:S.p.cur};
    }
  }
  function setCur(v){
    ensureDs();
    S.p.cur = v;
  }

  function winItem(row, w, key, p){

    var g = 0, t = 0, b = 0, lines = [], cur = null, mpg = p.mpg > 0 ? p.mpg : 7;

      else {

        if (cur && cur.kind === e.k && e.t - cur.last <= mpg + 0.5){ cur.n++; cur.last = e.t; }

  function renderChart(){
    var p = S.p, W = 720, H = 320, ml = 58, mr = 28, mt = 30, mb = 46, pw = W - ml - mr, ph = H - mt - mb, nd = Math.max(1, DAYS - 1);

    var goalLine = (p.goal < p.cap) ? '<line class="goal-l" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + goalY + '" y2="' + goalY + '"/><text class="ax" x="' + (W - mr - 4) + '" y="' + (goalY - 6) + '" text-anchor="end">冲刺目标 ' + (p.goal / 1e4) + '万</text>' : '';
    $('chart').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="累计 pt 走势：预计最终 ' + fmt(R.final) + ' pt">' +
      '<defs><linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--teal)" stop-opacity=".6"/><stop offset="1" stop-color="var(--teal)" stop-opacity="0"/></linearGradient></defs>' +
      g + '<line class="cap-l" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + capY + '" y2="' + capY + '"/>' +
      '<text class="ax-strong" x="' + (ml + 8) + '" y="' + (capY - 8) + '">封顶 ' + (p.cap / 1e4) + '万</text>' + goalLine +
      '<path class="area" d="' + area + '"/><polyline class="ln" points="' + pts.join(' ') + '"/>' + mark +
      '<use href="#sakura" x="' + (X(DAYS - 1) - 15) + '" y="' + (Y(last.cum) - 15) + '" width="30" height="30"/>' +
      '<text class="ax-strong" x="' + (X(DAYS - 1) - 18) + '" y="' + (Y(last.cum) - 16) + '" text-anchor="end">预计 ' + (R.final / 1e4).toFixed(1) + '万</text>' + xl + '</svg>';
  }

  function renderTable(){
    var h = '<table><thead><tr><th>日期</th><th>总局数</th><th>门票局</th><th>耗心局</th><th>自然回复</th><th>买心(组)</th><th>宝石</th><th>当日 pt</th><th>累计 pt</th><th>累计报酬</th></tr></thead><tbody>';
    R.rows.forEach(function(r){
      h += '<tr' + (r.i === 0 && !before && !ended ? ' class="now"' : '') + '><td>' + dlabel(r.i) + ' ' + wk(r.i) + '</td><td>' + r.games + '</td><td>' + r.tickets + '</td><td>' + r.hg + '</td><td>' + r.nat + '</td><td>' + r.packs + '</td><td>' + fmt(r.gems) + '</td><td>' + fmt(r.pts) + '</td><td>' + fmt(r.cum) + '</td><td>' + fmt(r.reward) + '</td></tr>';
    });
    var T = R.tot, tk = 0;
    R.rows.forEach(function(r){ tk += r.tickets; });
    h += '<tr class="tot"><td>合计</td><td>' + T.games + '</td><td>' + tk + '</td><td>' + T.used + '</td><td>' + T.nat + '</td><td>' + T.packs + '</td><td>' + fmt(T.gems) + '</td><td>' + fmt(T.pts) + '</td><td>' + fmt(R.final) + '</td><td>' + fmt(R.rwF) + '</td></tr></tbody></table>';
    $('tbl').innerHTML = h;
  }

  function renderAll(){
    ensureDs();
    R = calc(S.p, S.ds);
    renderCount(); renderToday(); renderOverview(); renderChecklist(); renderChart(); renderTable();
  }

  /* ---------- 保存 ---------- */
  var ref = null, timer = 0, writing = false, dirty = false;
  function snapshot(){ return JSON.stringify({p:S.p, c:S.c, ds:S.ds}); }
  function saveSoon(){
    try { localStorage.setItem(KEY, snapshot()); } catch (e) {}
    if (!ref) return;
    clearTimeout(timer);
    timer = setTimeout(flush, 900);
  }
  function flush(){
    if (!ref) return;
    if (writing){ dirty = true; return; }
    writing = true; dirty = false;
    ref.set({json:snapshot()}).catch(function(){}).then(function(){
      writing = false;
      if (dirty) flush();
    });
  }
  function adopt(obj){
    if (!obj) return;
    if (obj.p) S.p = Object.assign({}, DEF, obj.p);
    if (obj.c) S.c = obj.c;
    if (obj.ds) S.ds = obj.ds;
  }
  try { var raw = localStorage.getItem(KEY); if (raw) adopt(JSON.parse(raw)); } catch (e) {}

  /* ---------- 交互 ---------- */
  var pg = $('pgrid');
  function onParam(e){
    var k = e.target && e.target.dataset && e.target.dataset.k;
    if (!k) return;
    if (k === 'dsPt'){ ensureDs(); S.ds = {key:dkey(0), pt:num(e.target.value, S.ds.pt)}; }
    else S.p[k] = STR[k] ? (e.target.value || DEF[k]) : num(e.target.value, DEF[k]);
    saveSoon();
    R = calc(S.p, S.ds);
    renderToday(); renderOverview(); renderChecklist(); renderChart(); renderTable();
  }
  pg.addEventListener('input', onParam);
  pg.addEventListener('change', function(e){ if (e.target && e.target.tagName === 'SELECT') onParam(e); });
  $('resetP').addEventListener('click', function(){
    S.p = Object.assign({}, DEF); S.ds = null; ensureDs(); renderParams(); saveSoon(); renderAll();
  });
  $('seg').addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('button[data-mode]');
    if (!b) return;
    S.p.mode = b.dataset.mode; saveSoon(); renderParams(); renderAll();
  });
  $('today').addEventListener('change', function(e){
    if (e.target && e.target.id === 'curIn'){
      setCur(num(e.target.value, S.p.cur)); saveSoon(); renderParams(); renderAll();
    }
  });
  $('today').addEventListener('click', function(e){
    if (e.target && e.target.id === 'tickAll'){
      (R.todayKeys || []).forEach(function(k){ S.c[k] = 1; });
      saveSoon(); renderChecklist();
    }
  });
  var days = $('days');
  days.addEventListener('change', function(e){
    var k = e.target && e.target.dataset && e.target.dataset.k;
    if (!k) return;
    if (e.target.checked) S.c[k] = 1; else delete S.c[k];
    saveSoon(); updateProgress();
  });
  days.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('.day-head');
    if (!b) return;
    var d = b.parentNode, i = parseInt(d.dataset.i, 10), o = !d.classList.contains('open');
    open[i] = o;
    d.classList.toggle('open', o);
    b.setAttribute('aria-expanded', String(o));
    d.querySelector('.day-body').hidden = !o;
  });
  var rc = $('resetC'), armed = 0;
  rc.addEventListener('click', function(){
    if (!armed){
      armed = 1; rc.textContent = '再点一次确认清空';
      setTimeout(function(){ armed = 0; rc.textContent = '清空所有勾选'; }, 3500);
      return;
    }
    armed = 0; rc.textContent = '清空所有勾选';
    S.c = {}; saveSoon(); renderChecklist();
  });

  ensureDs();
  renderParams();
  renderAll();

  /* 登录后的查看者：勾选、参数和进度同步到自己的私有文档 */
  try {
    if (window.claude && window.claude.use){
      Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(r){
        var db = r[0], user = r[1];
        if (!db || !user) return null;
        return user.id().then(function(id){
          if (!id) return null;
          var d = db.doc('data/users/' + id + '/plan4');
          return d.get().then(function(snap){
            if (snap.exists){
              try { adopt(JSON.parse(snap.data().json)); ensureDs(); renderParams(); renderAll(); } catch (e) {}
            }
            ref = d;
          });
        });
      }).catch(function(){});
    }
  } catch (e) {}
})();
</script>

</body></html>
